<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="assets/css/base.css"><title>时间校准｜B区监控</title></head><body class="monitor-theme sync-theme" data-page="sync"><div class="monitorbar"><b>B-ZONE CCTV / TIME SYNC</b><span>离线缓存</span></div><main class="site-shell"><h1>三路录像时间校准</h1><p class="lead">三路缓存都拍到同一辆后勤推车经过 B12 服务门。摄像头时钟未接入门控主机 NTP；门控主机在 02:18:36 记录到同一辆推车，是这次校准的基准。</p><section class="sync-grid"><div class="sync-card"><b>CAM-04</b><p>推车经过时，画面显示 <b>02:18:18</b>。</p><label>相对门控主机 <select id="c04"><option value="">选择</option><option value="-18">慢18秒</option><option value="18">快18秒</option><option value="0">无偏差</option></select></label></div><div class="sync-card"><b>CAM-09</b><p>同一时刻，画面显示 <b>02:19:07</b>。</p><label>相对门控主机 <select id="c09"><option value="">选择</option><option value="31">快31秒</option><option value="-31">慢31秒</option><option value="0">无偏差</option></select></label></div><div class="sync-card"><b>CAM-12</b><p>同一时刻，画面显示 <b>02:18:36</b>。</p><label>相对门控主机 <select id="c12"><option value="">选择</option><option value="0">无偏差</option><option value="12">快12秒</option><option value="-12">慢12秒</option></select></label></div></section><button class="primary" id="checkSync">写入校准表</button><div id="syncMsg" aria-live="polite" class="console-output">等待输入。</div><p id="syncNext" class="hidden"><a class="primary" href="incident-login.html">打开事故归档</a></p></main><script src="assets/js/app.js"></script><script>(()=>{const routeReady=localStorage.getItem('jnc_route')==='1',done=localStorage.getItem('jnc_sync')==='1',m=document.getElementById('syncMsg'),n=document.getElementById('syncNext'),b=document.getElementById('checkSync');if(!routeReady){m.textContent='ROUTE TABLE MISSING / 先完成 B 区路线复原。';b.disabled=true;return}if(done){c04.value='-18';c09.value='31';c12.value='0';m.textContent='SYNC OK\nCAM-04 慢18s / CAM-09 快31s / CAM-12 ±0s\n02:41 附近的先后关系已经重新对齐。';n.classList.remove('hidden')}b.onclick=()=>{const a=c04.value,x=c09.value,c=c12.value;if(a==='-18'&&x==='31'&&c==='0'){m.textContent='SYNC OK\nCAM-04 慢18s / CAM-09 快31s / CAM-12 ±0s\n02:41 附近的先后关系已经重新对齐。';n.classList.remove('hidden');localStorage.setItem('jnc_sync','1')}else m.textContent='校准值未通过。三路画面需要以 02:18:36 的门控记录为共同事件。'}})();</script></body></html>
